listener 1883
allow_anonymous true

# Logging
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Persistent session support (required for clean_session=false clients)
# Stores QoS 1/2 messages and subscriptions across broker restarts
persistence true
persistence_location /mosquitto/data/

# High-throughput tuning for 5,000+ devices at ~83 msg/sec
# Increase the maximum number of queued messages per client
max_queued_messages 10000

# Remove message size limit (0 = unlimited)
message_size_limit 0

# Allow up to 100 in-flight QoS 1/2 messages per client
max_inflight_messages 100

log_type all

