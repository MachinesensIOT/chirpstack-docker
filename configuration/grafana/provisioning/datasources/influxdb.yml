apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: MSiOT_Test
      defaultBucket: MSiOT_Test_db
      tlsSkipVerify: true
    secureJsonData:
      # This token must match INFLUXDB_ADMIN_TOKEN in your .env file.
      # Grafana reads this at startup from the provisioning file.
      # Do NOT commit a real token here — use .env for the actual value.
      token: ${INFLUXDB_ADMIN_TOKEN}
    isDefault: true
    editable: true
