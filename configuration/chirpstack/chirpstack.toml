# Logging.
[logging]

  # Log level.
  #
  # Options are: trace, debug, info, warn error.
  level="info"


# PostgreSQL configuration.
[postgresql]

  # PostgreSQL DSN.
  #
  # Format example: postgres://<USERNAME>:<PASSWORD>@<HOSTNAME>/<DATABASE>?sslmode=<SSLMODE>.
  #
  # SSL mode options:
  #  * disable - Do not use TLS
  #  * prefer - Attempt to connect with TLS but allow sessions without
  #  * require - Require the use of TLS
  dsn="postgres://chirpstack:chirpstack@postgres/chirpstack?sslmode=disable"

  # Max open connections.
  #
  # This sets the max. number of open connections that are allowed in the
  # PostgreSQL connection pool.
  max_open_connections=50

  # Min idle connections.
  #
  # This sets the min. number of idle connections in the PostgreSQL connection
  # pool (0 = equal to max_open_connections).
  min_idle_connections=0


# Redis configuration.
[redis]

  # Server address or addresses.
  #
  # Set multiple addresses when connecting to a cluster.
  servers=[
    "redis://redis/",
  ]

  # TLS enabled.
  tls_enabled=false

  # Redis Cluster.
  #
  # Set this to true when the provided URLs are pointing to a Redis Cluster
  # instance.
  cluster=false


# Network related configuration.
[network]

  # Network identifier (NetID, 3 bytes) encoded as HEX (e.g. 010203).
  net_id="000000"

  # Enabled regions.
  #
  # Multiple regions can be enabled simultaneously. Each region must match
  # the 'name' parameter of the region configuration in '[[regions]]'.
  enabled_regions=[
    "as923",
    "as923_2",
    "as923_3",
    "as923_4",
    "au915_0",
    "cn470_10",
    "cn779",
    "eu433",
    "eu868",
    "in865",
    "ism2400",
    "kr920",
    "ru864",
    "us915_0",
    "us915_1",
  ]


# API interface configuration.
[api]

  # interface:port to bind the API interface to.
  bind="0.0.0.0:8080"

  # Secret.
  #
  # This secret is used for generating login and API tokens, make sure this
  # is never exposed. Changing this secret will invalidate all login and API
  # tokens. The following command can be used to generate a random secret:
  #   openssl rand -base64 32
  secret="G88GaTn630LBGq_2sozKXJ9Rtru845Pf3pZoQXoKcfUVNwE9ghHywsS5WO7s93phZAQg7HM_cXuXGDwC1uGR3Q=="


[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://mosquitto:1883/"
    json=true

    # QoS level for MQTT publish.
    # 0 = at most once (default, fire and forget)
    # 1 = at least once (acknowledged delivery — highest impact change)
    # 2 = exactly once (slowest, not recommended for high throughput)
    qos=1

    # Clean session.
    # Set to false to enable persistent MQTT session.
    # When false, the broker queues messages published while ChirpStack
    # is disconnected and delivers them on reconnect — prevents data loss.
    clean_session=false

    # Client ID for persistent session (required when clean_session=false).
    client_id="chirpstack"

# Monitoring configuration.
[monitoring]
  bind="0.0.0.0:8091"
  # Per-device frame-log max history.
  #
  # Setting this to 0 disables per-device frame logging, which significantly
  per_device_frame_log_max_history=0

  # Per-application frame-log max history.
  #
  # Setting this to 0 disables per-application frame logging.
  per_application_frame_log_max_history=0

  # Per-device event-log max history.
  #
  # Setting this to 0 disables per-device event logging.
  per_device_event_log_max_history=0

  # Per-application event-log max history.
  #
  # Setting this to 0 disables per-application event logging.
  per_application_event_log_max_history=0

